name: Build Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the generated ZIP to the selected release tag
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate publish ref
        if: inputs.publish
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) echo "Publish runs must use a v* tag ref." >&2; exit 1 ;;
          esac

      - name: Build and package
        id: package
        env:
          OST_RELEASE_TAG: ${{ inputs.publish && github.ref_name || '' }}
        run: |
          set -euo pipefail
          script/package_release.sh
          artifact_path="$(find "$PWD/.build/release" -maxdepth 1 -type f -name 'OST-*-macos-arm64.zip' -print -quit)"
          test -n "$artifact_path"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Store workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ github.sha }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error

      - name: Upload GitHub release asset
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.artifact_path }}
          fail_on_unmatched_files: true
